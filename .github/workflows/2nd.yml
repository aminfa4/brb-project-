name: Update Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  process-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pysocks

      - name: Retrieve Package
        env:
          SOURCE_URL: ${{ secrets.XQ7VNP4MK9222 }}
        run: |
          curl -fsSL "$SOURCE_URL" -o smap.py

      - name: Process
        run: |
          python smap.py > /dev/null 2>&1

      - name: Cleanup
        if: always()
        run: |
          rm -f smap.py
