name: Run project

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pysocks

      - name: Unzip Protected Python Script
        env:
          ZIP_FILE: ${{ secrets.ZIP_FILEPT }}
        run: |
          unzip -o -P "$ZIP_FILE" smap.zip

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python smap.py

      - name: Delete Script After Running
        if: always()
        run: |
          rm -f smap.py
